<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra Cứu Điểm Thi - Trường THPT Hồng Ngự 3</title>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.13.5/cdn.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
    <style>
        * { box-sizing: border-box; color: #000000; }
        body {
            font-family: Arial, Tahoma, sans-serif;
            background-color: #ffffff;
            color: #000000;
            font-size: 14px;
            margin: 0;
            padding: 0;
            line-height: 1.5;
        }
        [x-cloak] { display: none !important; }

        .wrapper {
            max-width: 1020px;
            margin: 20px auto;
            background: #ffffff;
            border: 1px solid #000000;
            padding: 20px 25px;
        }

        .school-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #000000;
            padding-bottom: 12px;
            margin-bottom: 25px;
            gap: 12px;
        }
        .header-left .dept-name {
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .header-left .school-name {
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 2px;
        }
        .header-left .sys-title {
            font-size: 13px;
            margin-top: 4px;
        }
        .header-right {
            flex-shrink: 0;
        }
        .header-right img {
            width: 72px;
            height: 72px;
            object-fit: contain;
            display: block;
        }

        .search-box {
            max-width: 460px;
            margin: 10px auto 25px auto;
            border: 1px solid #000000;
            background-color: #ffffff;
            padding: 18px;
        }
        .search-title {
            font-size: 15px;
            font-weight: bold;
            text-transform: uppercase;
            text-align: center;
            margin: 0 0 12px 0;
        }

        .btn {
            background-color: #ffffff;
            color: #000000;
            border: 1px solid #000000;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn:hover { background-color: #e5e5e5; }

        .input-text {
            width: 100%;
            padding: 7px 10px;
            border: 1px solid #000000;
            font-size: 14px;
            background-color: #ffffff;
            color: #000000;
        }

        .score-table {
            width: 100%;
            border-collapse: collapse;
            background-color: #ffffff;
            margin-top: 10px;
        }
        .score-table th, .score-table td {
            border: 1px solid #000000;
            padding: 6px 8px;
            text-align: center;
            color: #000000;
            white-space: nowrap;
        }
        .score-table th {
            background-color: #f2f2f2;
            font-weight: bold;
            font-size: 13px;
        }
        .score-table th.sub-col {
            font-size: 12px;
            font-weight: bold;
            background-color: #fafafa;
        }

        .notice-bar {
            padding: 8px 12px;
            margin-bottom: 15px;
            border: 1px solid #000000;
            background-color: #f2f2f2;
            color: #000000;
            font-size: 13px;
            font-weight: bold;
        }
    </style>
</head>
<body x-data="studentLookupApp()">

    <div class="wrapper">
        <!-- HEADER -->
        <div class="school-header">
            <div class="header-left">
                <div class="dept-name">SỞ GIÁO DỤC VÀ ĐÀO TẠO</div>
                <div class="school-name">TRƯỜNG THPT HỒNG NGỰ 3</div>
                <div class="sys-title">Hệ thống tra cứu kết quả điểm thi học sinh</div>
            </div>
            <div class="header-right" x-show="!logoFailed">
                <img :src="logoSrc" @error="onLogoError()" alt="Logo Trường THPT Hồng Ngự 3">
            </div>
        </div>

        <!-- Thông báo -->
        <div x-show="notice.show" x-cloak class="notice-bar">
            <span x-text="notice.text"></span>
        </div>

        <!-- MÀN HÌNH 1: TRA CỨU ĐIỂM -->
        <div x-show="view === 'lookup'">
            <div class="search-box">
                <div class="search-title">Tra cứu điểm thi</div>
                <form @submit.prevent="doSearch()" style="display: flex; gap: 6px;">
                    <input type="text" x-model="searchQuery"
                           placeholder="Nhập Số báo danh..."
                           autofocus
                           class="input-text" style="text-transform: uppercase; font-weight: bold;">
                    <button type="submit" class="btn" :disabled="loadingData" style="white-space: nowrap;">
                        <span x-text="loadingData ? 'Đang tải...' : 'Tra cứu'"></span>
                    </button>
                </form>
            </div>

            <!-- Thông báo nếu chưa tải được dữ liệu bảng điểm -->
            <div x-show="dataLoadError && !loadingData" x-cloak class="notice-bar" style="text-align: center; max-width: 560px; margin: 0 auto 15px auto;">
                <span x-text="dataLoadError"></span>
            </div>

            <!-- Kết quả tra cứu -->
            <div x-show="searched && !loadingData && !dataLoadError" x-cloak>
                <template x-if="foundStudent">
                    <div style="border: 1px solid #000000; padding: 15px; background: #ffffff;">
                        <div style="margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #000000; display: flex; flex-wrap: wrap; gap: 20px; font-size: 14px;">
                            <div>Số báo danh: <strong x-text="foundStudent.sbd"></strong></div>
                            <div>Họ và tên: <strong style="text-transform: uppercase;" x-text="foundStudent.hoTen"></strong></div>
                            <div x-show="foundStudent.ngaySinh">Ngày sinh: <strong x-text="foundStudent.ngaySinh"></strong></div>
                            <div x-show="foundStudent.lop">Lớp: <strong x-text="foundStudent.lop"></strong></div>
                        </div>

                        <!-- Bảng điểm chuẩn -->
                        <div style="overflow-x: auto;" x-html="renderScoreTableHtml()"></div>

                        <!-- Phần phúc khảo ở cuối bảng điểm -->
                        <div style="margin-top: 15px; padding-top: 12px; border-top: 1px solid #000000; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                            <div style="font-size: 13px;">
                                <template x-if="!isAppealExpired">
                                    <span>Thời hạn nhận đơn phúc khảo: <strong x-text="appealDeadlineFormatted"></strong> (<span x-text="appealRemainingText"></span>)</span>
                                </template>
                                <template x-if="isAppealExpired">
                                    <strong>Đã hết thời hạn đăng ký phúc khảo điểm thi.</strong>
                                </template>
                            </div>

                            <button type="button" x-show="!isAppealExpired" @click="openAppealPage()" class="btn">
                                Phúc khảo điểm
                            </button>
                        </div>
                    </div>
                </template>

                <template x-if="!foundStudent">
                    <div class="notice-bar" style="text-align: center; max-width: 460px; margin: 0 auto;">
                        Không tìm thấy thí sinh có Số báo danh "<span style="text-transform: uppercase;" x-text="searchQuery"></span>".
                    </div>
                </template>
            </div>
        </div>

        <!-- MÀN HÌNH 2: ĐƠN PHÚC KHẢO -->
        <div x-show="view === 'appeal'" x-cloak>
            <div style="border: 1px solid #000000; padding: 18px; background: #ffffff;">
                <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #000000; padding-bottom: 10px; margin-bottom: 15px;">
                    <strong style="font-size: 15px; text-transform: uppercase;">Đơn đăng ký phúc khảo điểm thi</strong>
                    <button type="button" class="btn" @click="view = 'lookup'">Quay lại bảng điểm</button>
                </div>

                <!-- Nhập Tên, Lớp, SBD -->
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 15px;">
                    <div>
                        <label style="display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px;">Họ và tên học sinh:</label>
                        <input type="text" class="input-text" x-model="appealForm.hoTen">
                    </div>
                    <div>
                        <label style="display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px;">Lớp:</label>
                        <input type="text" class="input-text" x-model="appealForm.lop">
                    </div>
                    <div>
                        <label style="display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px;">Số báo danh:</label>
                        <input type="text" class="input-text" x-model="appealForm.sbd" style="text-transform: uppercase; font-weight: bold;">
                    </div>
                </div>

                <p style="margin: 0 0 8px 0; font-size: 13px; font-weight: bold;">
                    Bảng chọn môn phúc khảo (có thể đánh dấu vào Tự luận, Trắc nghiệm hoặc cả 2 cột):
                </p>

                <table class="score-table">
                    <thead>
                        <tr>
                            <th style="text-align: left;">Môn học</th>
                            <th style="width: 120px;">Điểm tổng</th>
                            <th style="width: 140px;">Tự luận</th>
                            <th style="width: 140px;">Trắc nghiệm</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-for="sub in subjects" :key="sub">
                            <tr>
                                <td style="text-align: left; font-weight: bold;" x-text="sub"></td>
                                <td style="font-weight: bold;"
                                    x-text="formatScore(getScoreObj(foundStudent, sub).tong)"></td>
                                <td>
                                    <input type="checkbox" x-model="appealForm.selections[sub].tuLuan" style="width: 16px; height: 16px; cursor: pointer;">
                                </td>
                                <td>
                                    <input type="checkbox" x-model="appealForm.selections[sub].tracNghiem" style="width: 16px; height: 16px; cursor: pointer;">
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>

                <div style="margin-top: 15px; text-align: right;">
                    <button type="button" class="btn" @click="view = 'lookup'" style="margin-right: 6px;">Hủy</button>
                    <button type="button" class="btn" @click="submitAppeal()" :disabled="submittingAppeal || isAppealExpired">
                        <span x-text="submittingAppeal ? 'Đang gửi...' : 'Gửi đơn phúc khảo'"></span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function studentLookupApp() {
            const DAY_MS = 24 * 60 * 60 * 1000;
            const LOGO_FILES = ['logo HN3.jpg', 'logo HN3.png', 'logo.jpg', 'logo.png', 'image_4429fe.jpg'];

            const ALLOWED_SUBJECT_MAP = {
                'van': 'VĂN', 'nguvan': 'VĂN', 'monvan': 'VĂN',
                'su': 'SỬ', 'lichsu': 'SỬ', 'monsu': 'SỬ',
                'dia': 'ĐỊA', 'diali': 'ĐỊA', 'dialy': 'ĐỊA', 'mondia': 'ĐỊA',
                'anh': 'ANH', 'av': 'ANH', 'anhvan': 'ANH', 'tienganh': 'ANH', 'ngoaingu': 'ANH', 'nn': 'ANH',
                'ktpl': 'KTPL', 'gdktpl': 'KTPL', 'gdcd': 'KTPL', 'kinhtephapluat': 'KTPL',
                'toan': 'TOÁN', 'toanhoc': 'TOÁN', 'montoan': 'TOÁN',
                'ly': 'LÝ', 'li': 'LÝ', 'vatly': 'LÝ', 'vatli': 'LÝ', 'monly': 'LÝ',
                'hoa': 'HÓA', 'hoahoc': 'HÓA', 'monhoa': 'HÓA',
                'sinh': 'SINH', 'sinhhoc': 'SINH', 'monsinh': 'SINH',
                'tin': 'TIN', 'tinhoc': 'TIN', 'montin': 'TIN',
                'cn': 'CÔNG NGHỆ', 'congnghe': 'CÔNG NGHỆ', 'moncongnghe': 'CÔNG NGHỆ', 'cnnn': 'CÔNG NGHỆ', 'cncn': 'CÔNG NGHỆ'
            };

            return {
                view: 'lookup',
                loadingData: false,
                dataLoadError: '',
                cloudId: '',
                cloudProvider: '',
                inlineCompressed: '',

                logoSrc: LOGO_FILES[0],
                logoTryIdx: 1,
                logoFailed: false,
                hasEmbeddedLogo: false,

                subjects: [],
                records: [],
                appeals: [],
                appealStartTime: Date.now(),
                appealDays: 3,

                searchQuery: '',
                searched: false,
                foundStudent: null,

                appealForm: { hoTen: '', lop: '', sbd: '', selections: {} },
                submittingAppeal: false,
                notice: { show: false, text: '' },

                get appealDurationMs() {
                    const days = Math.max(0, Number(this.appealDays) || 0);
                    return days * DAY_MS;
                },

                get isAppealExpired() {
                    if (this.appealDurationMs <= 0) return true;
                    return Date.now() > (this.appealStartTime + this.appealDurationMs);
                },

                get appealDeadlineFormatted() {
                    const d = new Date((this.appealStartTime || Date.now()) + this.appealDurationMs);
                    return d.toLocaleString('vi-VN', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit', year: 'numeric' });
                },

                get appealRemainingText() {
                    const diff = (this.appealStartTime + this.appealDurationMs) - Date.now();
                    if (diff <= 0) return 'Đã hết hạn';
                    const days = Math.floor(diff / DAY_MS);
                    const hours = Math.floor((diff % DAY_MS) / (60 * 60 * 1000));
                    const mins = Math.floor((diff % (60 * 60 * 1000)) / (60 * 1000));
                    return `Còn ${days} ngày ${hours} giờ ${mins} phút`;
                },

                onLogoError() {
                    if (!this.hasEmbeddedLogo && this.logoTryIdx < LOGO_FILES.length) {
                        this.logoSrc = LOGO_FILES[this.logoTryIdx++];
                    } else {
                        this.logoFailed = true;
                    }
                },

                normalizeHeader(str) {
                    return String(str || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/[^a-z0-9]/g, '');
                },

                getCanonicalSubject(name) {
                    const norm = this.normalizeHeader(name);
                    return ALLOWED_SUBJECT_MAP[norm] || null;
                },

                isVanSubject(name) {
                    return this.normalizeHeader(name) === 'van';
                },

                getScoreObj(student, sub) {
                    if (!student || !student.scores || !student.scores[sub]) {
                        return { tn: null, tl: null, tong: null };
                    }
                    const val = student.scores[sub];
                    if (typeof val === 'object') return val;
                    return { tn: null, tl: null, tong: val };
                },

                escapeHtml(str) {
                    return String(str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
                },

                renderScoreTableHtml() {
                    if (!this.foundStudent || !this.subjects.length) return '';

                    const hasDetailScores = this.subjects.some(sub => {
                        if (this.isVanSubject(sub)) return false;
                        const sc = this.getScoreObj(this.foundStudent, sub);
                        return this.hasValidScore(sc.tn) || this.hasValidScore(sc.tl);
                    });

                    let row1 = '';
                    let row2 = '';
                    let rowVal = '';

                    this.subjects.forEach(sub => {
                        const safeSub = this.escapeHtml(sub);
                        const sc = this.getScoreObj(this.foundStudent, sub);

                        if (this.isVanSubject(sub) || !hasDetailScores) {
                            row1 += `<th ${hasDetailScores ? 'rowspan="2"' : ''}>${safeSub}</th>`;
                            rowVal += `<td style="font-size: 15px; font-weight: bold;">${this.formatScore(sc.tong)}</td>`;
                        } else {
                            row1 += `<th colspan="3">${safeSub}</th>`;
                            row2 += `<th class="sub-col">TN</th><th class="sub-col">TL</th><th class="sub-col">Tổng</th>`;
                            rowVal += `<td>${this.formatScore(sc.tn)}</td><td>${this.formatScore(sc.tl)}</td><td style="font-size: 15px; font-weight: bold;">${this.formatScore(sc.tong)}</td>`;
                        }
                    });

                    return `<table class="score-table">
                        <thead>
                            <tr>${row1}</tr>
                            ${row2 ? `<tr>${row2}</tr>` : ''}
                        </thead>
                        <tbody>
                            <tr>${rowVal}</tr>
                        </tbody>
                    </table>`;
                },

                async init() {
                    const savedLogo = localStorage.getItem('vn_synced_logo');
                    if (savedLogo) {
                        this.logoSrc = savedLogo;
                        this.hasEmbeddedLogo = true;
                        this.logoFailed = false;
                    }

                    const hash = window.location.hash || '';
                    const params = new URLSearchParams(window.location.search);

                    if (hash.startsWith('#k=b_')) {
                        this.cloudProvider = 'bytebin';
                        this.cloudId = decodeURIComponent(hash.slice(5).split('&')[0]);
                    } else if (hash.startsWith('#id=')) {
                        this.cloudProvider = 'jsonblob';
                        this.cloudId = decodeURIComponent(hash.slice(4).split('&')[0]);
                    } else if (hash.startsWith('#d=')) {
                        this.cloudProvider = 'inline';
                        this.inlineCompressed = hash.slice(3);
                    } else if (params.get('k') && params.get('k').startsWith('b_')) {
                        this.cloudProvider = 'bytebin';
                        this.cloudId = params.get('k').slice(2).trim();
                    } else if (params.get('id')) {
                        this.cloudProvider = 'jsonblob';
                        this.cloudId = params.get('id').trim();
                    } else {
                        this.cloudId = localStorage.getItem('vn_synced_cloud_id') || '';
                        this.cloudProvider = localStorage.getItem('vn_synced_cloud_provider') || '';
                    }

                    await this.fetchLatestScores();

                    window.addEventListener('storage', () => {
                        this.loadFallbackLocal();
                        if (this.searched && this.searchQuery) {
                            this.foundStudent = this.records.find(r => String(r.sbd).trim().toUpperCase() === this.searchQuery.trim().toUpperCase()) || null;
                        }
                    });
                },

                notify(text) {
                    this.notice = { show: true, text };
                    setTimeout(() => { this.notice.show = false; }, 4000);
                },

                initAppealSelections() {
                    const sel = {};
                    this.subjects.forEach(sub => { sel[sub] = { tuLuan: false, tracNghiem: false }; });
                    this.appealForm.selections = sel;
                },

                async fetchLatestScores() {
                    this.loadingData = true;
                    this.dataLoadError = '';
                    let loaded = false;

                    try {
                        // 1. Dữ liệu nén trực tiếp trên URL (#d=...)
                        if (this.cloudProvider === 'inline' && this.inlineCompressed && typeof LZString !== 'undefined') {
                            const jsonStr = LZString.decompressFromEncodedURIComponent(this.inlineCompressed);
                            if (jsonStr) {
                                this.applyPayload(JSON.parse(jsonStr));
                                loaded = this.records.length > 0;
                            }
                        }

                        // 2. Dữ liệu từ máy chủ đám mây (#id=... hoặc #k=b_...)
                        if (!loaded && this.cloudId) {
                            let res = null;
                            if (this.cloudProvider === 'bytebin') {
                                res = await fetch(`https://bytebin.lucko.me/${encodeURIComponent(this.cloudId)}`, { cache: 'no-store' });
                            } else {
                                res = await fetch(`https://jsonblob.com/api/jsonBlob/${encodeURIComponent(this.cloudId)}?t=${Date.now()}`, {
                                    headers: { 'Accept': 'application/json' },
                                    cache: 'no-store'
                                });
                            }
                            if (res && res.ok) {
                                const payload = await res.json();
                                this.applyPayload(payload);
                                loaded = this.records.length > 0;
                            }
                        }

                        // 3. Tự động đọc file data.json đặt chung thư mục trên web (Netlify / GitHub Pages)
                        if (!loaded && window.location.protocol !== 'file:') {
                            try {
                                const dataUrl = new URL('data.json', window.location.href).href + '?t=' + Date.now();
                                const res = await fetch(dataUrl, { cache: 'no-store' });
                                if (res.ok) {
                                    const payload = await res.json();
                                    this.applyPayload(payload);
                                    loaded = this.records.length > 0;
                                }
                            } catch (e) {}
                        }

                        // 4. Bộ nhớ cục bộ (khi mở cùng máy giáo viên)
                        if (!loaded) {
                            loaded = this.loadFallbackLocal();
                        }

                        if (!loaded) {
                            this.dataLoadError = 'Chưa tải được dữ liệu bảng điểm! Vui lòng liên hệ Giáo viên để kiểm tra lại đường link tra cứu (đảm bảo link có đầy đủ mã #id=... hoặc #k=...).';
                        }
                    } catch (e) {
                        if (!this.loadFallbackLocal()) {
                            this.dataLoadError = 'Lỗi kết nối khi tải dữ liệu bảng điểm. Vui lòng thử tải lại trang.';
                        }
                    } finally {
                        this.loadingData = false;
                    }
                },

                loadFallbackLocal() {
                    try {
                        const raw = localStorage.getItem('vn_synced_payload');
                        if (raw) {
                            this.applyPayload(JSON.parse(raw));
                            return this.records.length > 0;
                        }
                    } catch (e) {}
                    return false;
                },

                applyPayload(payload) {
                    if (!payload) return;
                    const rawSubjects = Array.isArray(payload.s) ? payload.s : [];
                    const validIndices = [];
                    this.subjects = [];
                    rawSubjects.forEach((sub, idx) => {
                        const canonical = this.getCanonicalSubject(sub);
                        if (canonical && !this.subjects.includes(canonical)) {
                            this.subjects.push(canonical);
                            validIndices.push(idx);
                        }
                    });

                    this.appealStartTime = payload.t || Date.now();
                    this.appealDays = (payload.d !== undefined && payload.d !== null) ? Number(payload.d) : 3;
                    this.appeals = Array.isArray(payload.a) ? payload.a : [];

                    if (payload.logo) {
                        this.logoSrc = payload.logo;
                        this.hasEmbeddedLogo = true;
                        this.logoFailed = false;
                    }

                    if (Array.isArray(payload.r)) {
                        this.records = payload.r.map(row => {
                            const scores = {};
                            const arr = row[4] || [];
                            validIndices.forEach((origIdx, newIdx) => {
                                const subName = this.subjects[newIdx];
                                const cell = arr[origIdx];
                                if (Array.isArray(cell)) {
                                    scores[subName] = { tn: cell[0], tl: cell[1], tong: cell[2] };
                                } else if (cell !== null && cell !== undefined && cell !== '') {
                                    scores[subName] = { tn: null, tl: null, tong: cell };
                                }
                            });
                            return { sbd: row[0], hoTen: row[1], ngaySinh: row[2] || '', lop: row[3] || '', scores };
                        });
                    }
                    this.initAppealSelections();
                },

                async doSearch() {
                    const q = this.searchQuery.trim().toUpperCase();
                    if (!q) return;
                    if (this.records.length === 0) {
                        await this.fetchLatestScores();
                    }
                    this.foundStudent = this.records.find(r => String(r.sbd).trim().toUpperCase() === q) || null;
                    this.searched = true;
                },

                openAppealPage() {
                    if (this.isAppealExpired) {
                        this.notify('Đã hết thời hạn đăng ký phúc khảo.');
                        return;
                    }
                    this.initAppealSelections();
                    if (this.foundStudent) {
                        this.appealForm.sbd = this.foundStudent.sbd || '';
                        this.appealForm.hoTen = this.foundStudent.hoTen || '';
                        this.appealForm.lop = this.foundStudent.lop || '';
                    }
                    this.view = 'appeal';
                },

                async submitAppeal() {
                    if (this.isAppealExpired) {
                        this.notify('Đã hết thời hạn phúc khảo.');
                        return;
                    }
                    const sbd = this.appealForm.sbd.trim().toUpperCase();
                    const hoTen = this.appealForm.hoTen.trim();
                    const lop = this.appealForm.lop.trim();

                    if (!sbd || !hoTen || !lop) {
                        this.notify('Vui lòng điền đầy đủ Họ và tên, Lớp, Số báo danh.');
                        return;
                    }

                    const monMap = {};
                    const summaryParts = [];

                    this.subjects.forEach(sub => {
                        const item = this.appealForm.selections[sub];
                        if (item && (item.tuLuan || item.tracNghiem)) {
                            const types = [];
                            if (item.tuLuan) types.push('Tự luận');
                            if (item.tracNghiem) types.push('Trắc nghiệm');
                            const typeStr = types.join(' + ');
                            monMap[sub] = typeStr;
                            summaryParts.push(`${sub} (${typeStr})`);
                        }
                    });

                    if (summaryParts.length === 0) {
                        this.notify('Vui lòng đánh dấu ít nhất 1 môn học cần phúc khảo.');
                        return;
                    }

                    this.submittingAppeal = true;
                    try {
                        let currentPayload = null;
                        if (this.cloudId && this.cloudProvider === 'jsonblob') {
                            const res = await fetch(`https://jsonblob.com/api/jsonBlob/${encodeURIComponent(this.cloudId)}?t=${Date.now()}`, {
                                headers: { 'Accept': 'application/json' },
                                cache: 'no-store'
                            });
                            if (res.ok) currentPayload = await res.json();
                        } else {
                            const localRaw = localStorage.getItem('vn_synced_payload');
                            if (localRaw) currentPayload = JSON.parse(localRaw);
                        }

                        if (!currentPayload) currentPayload = { s: this.subjects, t: this.appealStartTime, d: this.appealDays, a: [], r: [] };
                        if (!Array.isArray(currentPayload.a)) currentPayload.a = [];

                        currentPayload.a = currentPayload.a.filter(a => String(a.sbd).toUpperCase() !== sbd);
                        currentPayload.a.push({
                            sbd,
                            hoTen,
                            lop,
                            monMap: monMap,
                            chiTietMon: summaryParts.join('; '),
                            thoiGian: new Date().toLocaleString('vi-VN')
                        });

                        if (this.cloudId && this.cloudProvider === 'jsonblob') {
                            await fetch(`https://jsonblob.com/api/jsonBlob/${encodeURIComponent(this.cloudId)}`, {
                                method: 'PUT',
                                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                                body: JSON.stringify(currentPayload)
                            });
                        }
                        localStorage.setItem('vn_synced_payload', JSON.stringify(currentPayload));

                        this.notify('Đã gửi đơn đăng ký phúc khảo thành công.');
                        this.view = 'lookup';
                    } catch (e) {
                        this.notify('Lỗi kết nối khi gửi đơn, vui lòng thử lại.');
                    } finally {
                        this.submittingAppeal = false;
                    }
                },

                hasValidScore(val) {
                    if (val === '' || val === null || val === undefined) return false;
                    return !isNaN(parseFloat(String(val).replace(',', '.')));
                },

                formatScore(val) {
                    if (!this.hasValidScore(val)) return '-';
                    const num = parseFloat(String(val).replace(',', '.'));
                    return num.toFixed(2).replace(/\.00$/, '').replace(/(\.\d)0$/, '$1');
                }
            };
        }
    </script>
